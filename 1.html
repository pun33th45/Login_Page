<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #4f6df5, #7b4fd6);
        }
        .card {
            width: 100%;
            max-width: 360px;
            padding: 32px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        h2 { margin: 0 0 24px; text-align: center; color: #333; }
        label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #4f6df5; }
        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #4f6df5;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #3b57d9; }
    </style>
</head>
<body>
    <form class="card" onsubmit="event.preventDefault(); alert('Welcome, ' + document.getElementById('username').value + '!');">
        <h2>Login</h2>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <button type="submit">Login</button>
    </form>
</body>
</html>
